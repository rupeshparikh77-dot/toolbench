<meta name="claude:viewport-fit-sides" content="cover">
<title>Toolbench</title>
<style>
  /* Layout: fixed sidebar (search + categorized tool list) beside a scrollable work pane; collapses to stacked header + full-width pane under 760px. */
  :root{
    --bg:#eceff3; --surface:#ffffff; --surface-2:#f4f6f9; --surface-3:#eaedf1;
    --border:#d7dde4; --border-strong:#c3ccd5;
    --fg:#16202b; --muted:#5c6b7a; --faint:#8a97a4;
    --accent:#0d9488; --accent-2:#0f766e; --accent-fg:#ffffff; --accent-wash:#e3f4f1;
    --good:#15803d; --warn:#b45309; --bad:#dc2626;
    --radius:10px; --radius-sm:7px;
    --shadow:0 1px 2px rgba(16,32,48,.06), 0 6px 20px rgba(16,32,48,.06);
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0d1117; --surface:#161b22; --surface-2:#1b222c; --surface-3:#222b36;
    --border:#2a333e; --border-strong:#3a4552;
    --fg:#e6edf3; --muted:#93a1b0; --faint:#6b7a89;
    --accent:#2dd4bf; --accent-2:#5eead4; --accent-fg:#06211e; --accent-wash:#12302c;
    --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 26px rgba(0,0,0,.35);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0d1117; --surface:#161b22; --surface-2:#1b222c; --surface-3:#222b36;
    --border:#2a333e; --border-strong:#3a4552;
    --fg:#e6edf3; --muted:#93a1b0; --faint:#6b7a89;
    --accent:#2dd4bf; --accent-2:#5eead4; --accent-fg:#06211e; --accent-wash:#12302c;
    --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 26px rgba(0,0,0,.35);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--accent-2)}
  h1,h2,h3{text-wrap:balance;margin:0}

  .app{height:100%;display:grid;grid-template-columns:304px 1fr;overflow:hidden}

  /* Sidebar */
  .side{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:10px;padding:16px max(16px,env(safe-area-inset-left,0px)) 12px;border-bottom:1px solid var(--border)}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);flex:none}
  .brand .logo svg{width:16px;height:16px}
  .brand .name{font-weight:600;letter-spacing:.2px;font-size:15px}
  .brand .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);padding:2px 7px;border-radius:20px}
  .searchwrap{padding:12px max(12px,env(safe-area-inset-left,0px));position:relative}
  .searchwrap svg{position:absolute;left:calc(max(12px,env(safe-area-inset-left,0px)) + 11px);top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint);pointer-events:none}
  .search{width:100%;padding:9px 12px 9px 34px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);outline:none}
  .search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  .toollist{flex:1;overflow:auto;min-height:0;padding:4px max(8px,env(safe-area-inset-left,0px)) 24px}
  .cat{margin-top:10px}
  .cat>.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:8px 10px 4px}
  .titem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 11px;font-size:15px;border:none;background:none;border-radius:var(--radius-sm);cursor:pointer;color:var(--fg)}
  .titem:hover{background:var(--surface-2)}
  .titem.active{background:var(--accent-wash);color:var(--accent-2);font-weight:600}
  .titem .ti{width:15px;height:15px;color:var(--muted);flex:none}
  .titem.active .ti{color:var(--accent-2)}
  .titem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .noresult{padding:16px 12px;color:var(--muted);font-size:13px}

  /* Main */
  .main{min-height:0;overflow:auto;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 86%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .back{display:none;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;cursor:pointer;color:var(--fg)}
  .topbar .tt{min-width:0}
  .topbar .tt h2{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .tt p{margin:1px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .theme{margin-left:auto;flex:none;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
  .theme svg{width:17px;height:17px}
  .content{padding:20px max(18px,env(safe-area-inset-right,0px)) 60px max(18px,env(safe-area-inset-left,0px));flex:1}
  .pane{max-width:880px;margin:0 auto}

  /* Overview grid */
  .ov-head{max-width:980px;margin:0 auto 18px}
  .ov-head h1{font-size:22px;font-weight:600}
  .ov-head p{color:var(--muted);margin:6px 0 0;max-width:60ch}
  .ovcat{max-width:980px;margin:0 auto 26px}
  .ovcat>.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .ovtabs{display:flex;gap:8px;flex-wrap:wrap;max-width:980px;margin:0 auto 20px}
  .ovtab{padding:10px 18px;border:1px solid var(--border);border-radius:24px;background:var(--surface);cursor:pointer;font-weight:600;font-size:14.5px;white-space:nowrap;color:var(--fg)}
  .ovtab:hover{border-color:var(--accent)}
  .ovtab.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
  .card{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:border-color .12s,transform .12s,box-shadow .12s}
  .card:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
  .card .ci{width:32px;height:32px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent-2);flex:none}
  .card .ci svg{width:17px;height:17px}
  .card .cb{min-width:0}
  .card .cb b{font-weight:600;font-size:15px;display:block}
  .card .cb small{color:var(--muted);font-size:13px;display:block;margin-top:3px;line-height:1.4}
  .card .ci{width:38px;height:38px}
  .card .ci svg{width:19px;height:19px}

  /* Tool UI primitives */
  .field{margin-bottom:12px}
  .field>label{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.01em}
  .field{margin-bottom:16px}
  .inp,textarea.inp,select.inp{width:100%;padding:13px 15px;font-size:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);outline:none;font-variant-numeric:tabular-nums}
  textarea.inp{resize:vertical;min-height:120px;font-family:var(--mono);line-height:1.55}
  .inp:focus,textarea.inp:focus,select.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  .inp.mono{font-family:var(--mono)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:140px}
  .row3>*{min-width:110px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 22px;font-size:16px;background:var(--accent);color:var(--accent-fg);border:1px solid transparent;border-radius:var(--radius-sm);font-weight:600;cursor:pointer}
  .btn:hover{background:var(--accent-2)}
  .btn.ghost{background:var(--surface-2);color:var(--fg);border-color:var(--border)}
  .btn.ghost:hover{background:var(--surface-3);border-color:var(--border-strong)}
  .btn.sm{padding:9px 15px;font-size:14px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:9px 15px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:14.5px}
  .chip.on{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-2);font-weight:600}

  .out{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-top:4px}
  .out.mono{font-family:var(--mono);white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.55}
  .outhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px}
  .outhead .lbl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
  .big{font-family:var(--mono);font-size:38px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.1}
  .big.sm{font-size:28px}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:15px}
  .kv .k{color:var(--muted)}
  .kv .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
  .note{font-size:12px;color:var(--muted);margin-top:10px;padding:9px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;gap:8px}
  .note svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--faint)}
  .err{color:var(--bad)} .ok{color:var(--good)} .wn{color:var(--warn)}
  .copy{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
  .copy:hover{border-color:var(--accent);color:var(--accent-2)}
  .copy svg{width:13px;height:13px}

  table.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
  table.tbl th,table.tbl td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border)}
  table.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  table.tbl td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
  .scrollx{overflow-x:auto}

  .calcpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .calcpad button{padding:19px 0;font-size:19px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .calcpad button:hover{background:var(--surface-2)}
  .calcpad button.op{color:var(--accent-2);font-weight:600}
  .calcpad button.eq{background:var(--accent);color:var(--accent-fg);border-color:transparent}
  .calcpad button.fn{font-size:13px;color:var(--muted)}
  .calcdisp{text-align:right;font-family:var(--mono);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
  .calcdisp .expr{color:var(--muted);font-size:13px;min-height:16px;word-break:break-all}
  .calcdisp .res{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px;word-break:break-all}

  .swatch{display:inline-block;width:100%;height:60px;border-radius:var(--radius-sm);border:1px solid var(--border)}
  .pal{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
  .pal .c{height:88px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;cursor:pointer;font-family:var(--mono);font-size:11px}

  .filedrop{border:2px dashed var(--border-strong);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface-2)}
  .filedrop.over{border-color:var(--accent);background:var(--accent-wash);color:var(--accent-2)}
  .pagelist{display:flex;flex-direction:column;gap:6px;margin:12px 0}
  .pagerow{display:flex;align-items:center;gap:10px;padding:8px 11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm)}
  .pagerow .pn{font-family:var(--mono);color:var(--muted);width:42px;flex:none}
  .pagerow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pagerow button{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;width:28px;height:28px;cursor:pointer;color:var(--muted)}
  .pagerow button:hover{border-color:var(--accent);color:var(--accent-2)}

  .flash{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:50}
  .flash.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

  @media (max-width:760px){
    .app{grid-template-columns:1fr}
    .side{border-right:none}
    .main{display:none}
    .app.viewing .side{display:none}
    .app.viewing .main{display:flex}
    .back{display:inline-flex}
    .theme.mobtop{margin-left:auto}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <aside class="side">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>
      <span class="name">Toolbench</span>
      <span class="count" id="count">0</span>
    </div>
    <div class="searchwrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="search" id="search" placeholder="Search 90 tools…" autocomplete="off" spellcheck="false">
    </div>
    <nav class="toollist" id="toollist"></nav>
  </aside>

  <main class="main" id="main">
    <div class="topbar">
      <button class="back" id="back"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>All tools</button>
      <div class="tt" id="tooltitle" hidden><h2 id="tt-name"></h2><p id="tt-desc"></p></div>
      <button class="theme" id="theme" title="Toggle theme"></button>
    </div>
    <div class="content"><div id="view"></div></div>
  </main>
</div>
<div class="flash" id="flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const view = $('#view');
const flashEl = $('#flash');
let flashTimer;
function flash(msg){ flashEl.textContent=msg; flashEl.classList.add('show'); clearTimeout(flashTimer); flashTimer=setTimeout(()=>flashEl.classList.remove('show'),1400); }
function fmt(n,d=6){ if(!isFinite(n)) return String(n); const r=Number(n.toFixed(d)); return r.toLocaleString(undefined,{maximumFractionDigits:d}); }
function fmt2(n){ return Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

async function copyText(t,btn){
  const ok=()=>{ if(btn){const o=btn.innerHTML; btn.innerHTML='✓ Copied'; setTimeout(()=>btn.innerHTML=o,1200);} flash('Copied to clipboard'); };
  try{ await navigator.clipboard.writeText(t); ok(); }
  catch{ try{ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); ok(); }catch{ flash('Copy failed — select manually'); } }
}
function download(name,data,mime='application/octet-stream'){
  try{
    const blob = data instanceof Blob ? data : new Blob([data],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    flash('Download started');
  }catch(e){ flash('Download blocked in preview — works when self-hosted'); }
}
// delegated copy buttons: data-copy="#id" or data-copy-val from textContent
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-copy]'); if(!b) return;
  const sel=b.getAttribute('data-copy');
  const src=sel.startsWith('#')?$(sel):null;
  const t = src ? (('value' in src && src.value!==undefined && src.tagName!=='DIV')?src.value:src.textContent) : sel;
  copyText(t,b);
});
const COPYSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
function copyBtn(sel,label='Copy'){ return `<button class="copy" data-copy="${sel}">${COPYSVG}${label}</button>`; }

/* ---------- expression evaluator (scientific) ---------- */
function makeEval(angle='rad'){
  const toR = x => angle==='deg'? x*Math.PI/180 : x;
  const fromR = x => angle==='deg'? x*180/Math.PI : x;
  const CONST={pi:Math.PI,e:Math.E,tau:Math.PI*2,phi:(1+Math.sqrt(5))/2};
  const FN={
    sin:x=>Math.sin(toR(x)),cos:x=>Math.cos(toR(x)),tan:x=>Math.tan(toR(x)),
    asin:x=>fromR(Math.asin(x)),acos:x=>fromR(Math.acos(x)),atan:x=>fromR(Math.atan(x)),
    sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,
    sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,ln:Math.log,log:Math.log10,log2:Math.log2,
    exp:Math.exp,floor:Math.floor,ceil:Math.ceil,round:Math.round,sign:Math.sign,
    fact:n=>{ if(n<0||n!==Math.floor(n))return NaN; let r=1; for(let i=2;i<=n;i++)r*=i; return r; }
  };
  function tokenize(s){
    const t=[]; let i=0;
    while(i<s.length){
      const c=s[i];
      if(/\s/.test(c)){i++;continue;}
      if(/[0-9.]/.test(c)){ let j=i+1; while(j<s.length&&/[0-9.eE]/.test(s[j])){ if((s[j]==='e'||s[j]==='E')&&(s[j+1]==='+'||s[j+1]==='-'))j++; j++; } t.push({t:'num',v:parseFloat(s.slice(i,j))}); i=j; continue; }
      if(/[a-zA-Z_]/.test(c)){ let j=i+1; while(j<s.length&&/[a-zA-Z0-9_]/.test(s[j]))j++; t.push({t:'id',v:s.slice(i,j).toLowerCase()}); i=j; continue; }
      if('+-*/^%(),!'.includes(c)){ t.push({t:'op',v:c}); i++; continue; }
      throw new Error('Unexpected "'+c+'"');
    }
    return t;
  }
  return function(src){
    const tk=tokenize(src); let p=0;
    const peek=()=>tk[p], eat=()=>tk[p++];
    function parseExpr(){ let v=parseTerm(); while(peek()&&peek().t==='op'&&(peek().v==='+'||peek().v==='-')){ const o=eat().v; const r=parseTerm(); v=o==='+'?v+r:v-r; } return v; }
    function parseTerm(){ let v=parseUnary(); while(peek()&&peek().t==='op'&&'*/%'.includes(peek().v)){ const o=eat().v; const r=parseUnary(); v=o==='*'?v*r:o==='/'?v/r:v%r; } return v; }
    function parseUnary(){ if(peek()&&peek().t==='op'&&(peek().v==='-'||peek().v==='+')){ const o=eat().v; const v=parseUnary(); return o==='-'?-v:v; } return parsePow(); }
    function parsePow(){ let b=parsePost(); if(peek()&&peek().t==='op'&&peek().v==='^'){ eat(); const e=parseUnary(); return Math.pow(b,e); } return b; }
    function parsePost(){ let v=parsePrimary(); while(peek()&&peek().t==='op'&&peek().v==='!'){ eat(); v=FN.fact(v); } return v; }
    function parsePrimary(){
      const x=peek(); if(!x) throw new Error('Unexpected end');
      if(x.t==='num'){ eat(); return x.v; }
      if(x.t==='op'&&x.v==='('){ eat(); const v=parseExpr(); if(!peek()||peek().v!==')')throw new Error('Missing )'); eat(); return v; }
      if(x.t==='id'){ eat(); const name=x.v;
        if(peek()&&peek().t==='op'&&peek().v==='('){ eat(); const arg=parseExpr(); if(!peek()||peek().v!==')')throw new Error('Missing )'); eat(); if(!FN[name])throw new Error('Unknown fn '+name); return FN[name](arg); }
        if(name in CONST) return CONST[name];
        throw new Error('Unknown "'+name+'"');
      }
      throw new Error('Unexpected token');
    }
    const r=parseExpr(); if(p<tk.length) throw new Error('Unexpected "'+(tk[p].v)+'"'); return r;
  };
}

/* ---------- unit converter factory ---------- */
function unitTool(units,defFrom,defTo,defVal){
  return root=>{
    const keys=Object.keys(units);
    const opts=k=>keys.map(u=>`<option value="${u}"${u===k?' selected':''}>${units[u].label}</option>`).join('');
    root.innerHTML=`
      <div class="field"><label>Value</label><input class="inp" id="uv" type="number" value="${defVal}"></div>
      <div class="row"><div class="field"><label>From</label><select class="inp" id="uf">${opts(defFrom)}</select></div>
      <div class="field"><label>To</label><select class="inp" id="ut">${opts(defTo)}</select></div></div>
      <button class="btn ghost sm" id="uswap">⇄ Swap</button>
      <div class="out" style="margin-top:14px"><div class="outhead"><span class="lbl">Result</span>${copyBtn('#ures')}</div><div class="big sm" id="ures">—</div><div class="sub" id="uall"></div></div>`;
    const calc=()=>{
      const v=parseFloat($('#uv',root).value); const f=$('#uf',root).value,t=$('#ut',root).value;
      if(!isFinite(v)){ $('#ures',root).textContent='—'; $('#uall',root).textContent=''; return; }
      const base=units[f].to(v); const r=units[t].from(base);
      $('#ures',root).textContent=fmt(r,8)+' '+units[t].sym;
      $('#uall',root).innerHTML = keys.filter(k=>k!==t).slice(0,6).map(k=>`${units[k].sym} ${fmt(units[k].from(base),6)}`).join(' · ');
    };
    $('#uswap',root).onclick=()=>{ const f=$('#uf',root),t=$('#ut',root); [f.value,t.value]=[t.value,f.value]; calc(); };
    root.addEventListener('input',calc); calc();
  };
}

T('prime','calc','Prime Checker & Factorizer','Test primality and show prime factors','prime factor factorize number',root=>{

    let x=n,factors=[]; for(let d=2;d*d<=x;d++){ while(x%d===0){factors.push(d);x/=d;} } if(x>1)factors.push(x);

    const grouped={}; factors.forEach(f=>grouped[f]=(grouped[f]||0)+1);

  function countDiv(g){ return Object.values(g).reduce((a,e)=>a*(e+1),1); }

});

T('stopwatch','time','Stopwatch','Start, stop, lap timer','stopwatch timer lap elapsed',root=>{
  root.innerHTML=`<div class="out" style="text-align:center;padding:26px"><div class="big" id="sw" style="font-size:40px">00:00.00</div></div>
   <div class="btns" style="justify-content:center"><button class="btn" id="swStart">Start</button><button class="btn ghost" id="swLap">Lap</button><button class="btn ghost" id="swReset">Reset</button></div>
   <div class="out mono" id="swLaps" style="display:none"></div>`;
  let start=0,elapsed=0,running=false,laps=[],raf;
  const render=t=>{ const m=Math.floor(t/60000),s=Math.floor(t%60000/1000),cs=Math.floor(t%1000/10); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`; };
  const tick=()=>{ $('#sw',root).textContent=render(elapsed+(running?Date.now()-start:0)); raf=requestAnimationFrame(tick); };
  $('#swStart',root).onclick=e=>{ if(running){ elapsed+=Date.now()-start; running=false; e.target.textContent='Start'; } else { start=Date.now(); running=true; e.target.textContent='Stop'; } };
  $('#swLap',root).onclick=()=>{ const t=elapsed+(running?Date.now()-start:0); laps.unshift(render(t)); $('#swLaps',root).style.display='block'; $('#swLaps',root).innerHTML=laps.map((l,i)=>`Lap ${laps.length-i}: ${l}`).join('\n'); };
  $('#swReset',root).onclick=()=>{ elapsed=0;running=false;laps=[];start=0; $('#swStart',root).textContent='Start'; $('#swLaps',root).style.display='none'; };
  tick(); intervals.push({__raf:raf});
  const origClear=clearIntervals;

T('diff','dev','Text Diff','Line-by-line comparison of two texts','diff compare difference text changes',root=>{
  root.innerHTML=`<div class="row"><div class="field"><label>Original</label><textarea class="inp mono" id="dfa" style="min-height:140px">line one\nline two\nline three\nline four</textarea></div>
   <div class="field"><label>Changed</label><textarea class="inp mono" id="dfb" style="min-height:140px">line one\nline 2\nline three\nline four\nline five</textarea></div></div>
   <div class="out mono" id="dfo" style="white-space:pre-wrap;line-height:1.6"></div>`;
  function lcsDiff(a,b){ const n=a.length,m=b.length; const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0)); for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]); const res=[]; let i=0,j=0; while(i<n&&j<m){ if(a[i]===b[j]){res.push(['=',a[i]]);i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]){res.push(['-',a[i]]);i++;} else {res.push(['+',b[j]]);j++;} } while(i<n)res.push(['-',a[i++]]); while(j<m)res.push(['+',b[j++]]); return res; }
  const c=()=>{ const d=lcsDiff($('#dfa',root).value.split('\n'),$('#dfb',root).value.split('\n')); $('#dfo',root).innerHTML=d.map(([t,l])=>{ const col=t==='+'?'var(--good)':t==='-'?'var(--bad)':'var(--muted)'; const bg=t==='+'?'rgba(34,197,94,.08)':t==='-'?'rgba(239,68,68,.08)':'transparent'; return `<div style="color:${col};background:${bg};padding:0 4px">${t==='='?' ':t} ${esc(l)}</div>`; }).join(''); };
  root.addEventListener('input',c); c();
});

function buildList(filter=''){
  const q=filter.trim().toLowerCase();
  const list=$('#toollist'); list.innerHTML='';
  let any=false;
  Object.keys(CATS).forEach(cat=>{
    const items=(byCat[cat]||[]).filter(t=> !q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.kw.includes(q) || t.kw.split(' ').some(k=>k.startsWith(q)) );
    if(!items.length) return; any=true;
    const sec=document.createElement('div'); sec.className='cat';
    sec.innerHTML=`<div class="lbl">${CATS[cat]}</div>`;
    items.forEach(t=>{ const b=document.createElement('button'); b.className='titem'+(t.id===current?' active':''); b.dataset.id=t.id; b.innerHTML=`<span class="ti">${ico(I[cat])}</span><span>${t.name}</span>`; b.onclick=()=>openTool(t.id); sec.appendChild(b); });
    list.appendChild(sec);
  });
  if(!any) list.innerHTML='<div class="noresult">No tools match that search.</div>';
}

  current=null; location.hash='';
  $('#app').classList.remove('viewing');
  $('#tooltitle').hidden=true;
  buildList($('#search').value);
  const cats=Object.keys(CATS);
  let html=`<div class="ov-head"><h1>Toolbench</h1><p>${TOOLS.length} fast, offline utilities — calculators, converters, text and dev tools, generators and file helpers. Everything runs in your browser.</p></div>`;
  html+=`<div class="ovtabs"><button class="ovtab on" data-f="all">All · ${TOOLS.length}</button>`+cats.map(c=>`<button class="ovtab" data-f="${c}">${CATS[c]} · ${(byCat[c]||[]).length}</button>`).join('')+`</div>`;
  cats.forEach(cat=>{
    html+=`<div class="ovcat" data-cat="${cat}"><div class="lbl">${CATS[cat]}</div><div class="grid">`;
    (byCat[cat]||[]).forEach(t=>{ html+=`<button class="card" data-id="${t.id}"><span class="ci">${ico(I[cat])}</span><span class="cb"><b>${t.name}</b><small>${t.desc}</small></span></button>`; });
    html+=`</div></div>`;
  });
  view.innerHTML=html;
  $$('.card',view).forEach(c=>c.onclick=()=>openTool(c.dataset.id));
  $$('.ovtab',view).forEach(tab=>tab.onclick=()=>{
    $$('.ovtab',view).forEach(x=>x.classList.remove('on')); tab.classList.add('on');
    const f=tab.dataset.f;
    $$('.ovcat',view).forEach(sec=>{ sec.hidden = (f!=='all' && sec.dataset.cat!==f); });
    $('#main').scrollTop=0;
  });
  $('.content').scrollTop=0; $('#main').scrollTop=0;
}

let current=null;
function openTool(id){
  const t=TOOLS.find(x=>x.id===id); if(!t){ showOverview(); return; }
  clearIntervals();
  current=id; location.hash=id;
  $('#app').classList.add('viewing');
  $('#tooltitle').hidden=false;
  $('#tt-name').textContent=t.name; $('#tt-desc').textContent=t.desc;
  view.innerHTML=''; const wrap=document.createElement('div'); wrap.className='pane'; view.appendChild(wrap);
  try{ t.mount(wrap); }catch(e){ wrap.innerHTML='<div class="out err">This tool hit an error: '+esc(e.message)+'</div>'; }
  buildList($('#search').value);
  $('.content').scrollTop=0; $('#main').scrollTop=0;
}

// clean interval clearing that also cancels stopwatch RAF entries
const _clear=clearIntervals;
clearIntervals=function(){ while(intervals.length){ const x=intervals.pop(); if(x&&x.__raf)cancelAnimationFrame(x.__raf); else clearInterval(x); } };

$('#search').addEventListener('input',e=>buildList(e.target.value));
$('#back').onclick=showOverview;
$('.brand').style.cursor='pointer'; $('.brand').onclick=showOverview;

/* theme toggle */
const themeBtn=$('#theme');
function curTheme(){ return document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'); }
function setTheme(t){ document.documentElement.setAttribute('data-theme',t); try{localStorage.setItem('tb-theme',t);}catch{} paintTheme(); }
function paintTheme(){ themeBtn.innerHTML=ico(curTheme()==='dark'?I.sun:I.moon); }
try{ const s=localStorage.getItem('tb-theme'); if(s)document.documentElement.setAttribute('data-theme',s); }catch{}
themeBtn.onclick=()=>setTheme(curTheme()==='dark'?'light':'dark');
paintTheme();

/* boot */
const initial=decodeURIComponent(location.hash.replace('#','')).trim();
if(initial && TOOLS.find(t=>t.id===initial)) openTool(initial); else showOverview();
window.addEventListener('hashchange',()=>{ const h=location.hash.replace('#','').trim(); if(!h) showOverview(); else if(h!==current) openTool(h); });
</script>
